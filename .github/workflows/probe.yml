# MIDLERTIDIG: undersøker matinfo.no. Fjernes før merge.
name: Probe
on:
  push:
    branches: [claude/project-thread-tzut7f]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: matinfo
        run: |
          UA="Middagsplanlegger/1.0 (probe)"
          echo "== robots produkter"; curl -sSL -A "$UA" https://produkter.matinfo.no/robots.txt > /tmp/r.txt; head -c 1500 /tmp/r.txt; echo
          curl -sSL -A "$UA" "https://produkter.matinfo.no/Scripts/react/app.js" -o /tmp/app.js
          echo "== url-strenger"
          grep -oE "[\"'\`]/[A-Za-z][A-Za-z0-9/_-]{2,80}[\"'\`?]" /tmp/app.js | sort | uniq -c | sort -rn | head -120
          echo "== rundt resultat/search"
          grep -oE ".{0,160}(resultat|Resultat|searchString|SearchProducts|GetProducts|/Product/|/product/).{0,160}" /tmp/app.js | head -40
          echo "== rundt nutrients"
          grep -oE ".{0,200}nutrientRows.{0,200}" /tmp/app.js | head -5
