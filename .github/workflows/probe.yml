# MIDLERTIDIG: undersøker matinfo.no. Fjernes før merge.
name: Probe
on:
  push:
    branches: [claude/project-thread-tzut7f]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: matinfo
        run: |
          UA="Middagsplanlegger/1.0 (probe)"
          curl -sSL -A "$UA" "https://produkter.matinfo.no/resultat?query=kokosmelk" -o /tmp/res.html
          for b in $(grep -oE '/bundles/[a-zA-Z-]+\?v=[A-Za-z0-9_-]+' /tmp/res.html | sort -u); do
            curl -sSL -A "$UA" "https://produkter.matinfo.no$b" -o /tmp/b.js
            echo "=== $b $(wc -c < /tmp/b.js)"
            grep -oE ".{0,100}(url\s*:|\\\$\.(get|post|ajax|getJSON)\(|fetch\().{0,160}" /tmp/b.js | grep -v "jquery.com" | head -40
          done
          echo "== inline scripts i resultat"
          grep -oE ".{0,120}(api|Api|url|Url|search|Search|resultat).{0,160}" /tmp/res.html | grep -v "googletag\|cookiebot\|vwo" | head -40
          for u in "https://produkter.matinfo.no/api/products/search?query=kokosmelk" "https://produkter.matinfo.no/Product/Search?query=kokosmelk" "https://produkter.matinfo.no/resultat/sok?query=kokosmelk" "https://produkter.matinfo.no/Result/Search?query=kokosmelk" "https://produkter.matinfo.no/Search?query=kokosmelk" "https://produkter.matinfo.no/api/search/products?query=kokosmelk"; do
            echo "=================== $u"
            curl -sSL -A "$UA" -H "Accept: application/json" -H "X-Requested-With: XMLHttpRequest" -o /tmp/p -w "HTTP %{http_code} %{content_type}\n" "$u" || true
            head -c 600 /tmp/p | tr '\n' ' '; echo
          done
