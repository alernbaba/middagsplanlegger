# MIDLERTIDIG: tester matinfo-oppslag. Fjernes før merge.
name: Probe
on:
  push:
    branches: [claude/project-thread-tzut7f]
    paths: ['.github/workflows/probe.yml', 'scraper/src/matinfo.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run inspect -- --matinfo kokosmelk,fiskesaus,rekepasta,tamarind,sitrongress,leverpostei,bakepulver
